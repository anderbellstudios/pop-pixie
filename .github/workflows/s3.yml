name: Upload to S3

# 1. Deploy an S3-compatible file upload server such as Minio
# 2. Create the following GitHub secrets:
#    - AWS_ACCESS_KEY_ID
#    - AWS_SECRET_ACCESS_KEY
#    - AWS_REGION (e.g. us-east-1)
#    - AWS_ENDPOINT_URL (e.g. https://minio.example.com)
#    - S3_BUCKET

on: workflow_call

jobs:
  steam:
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: Build-StandaloneWindows64
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/windows

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: Build-StandaloneOSX
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/macos

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp ./build/windows $BASE_PATH/windows --content-disposition 'attachment; filename=Install Pop Pixie.exe'
          aws s3 cp ./build/macos $BASE_PATH/macos --content-disposition 'attachment; filename=Install Pop Pixie.dmg'
        env:
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          BASE_PATH: s3://${{ secrets.S3_BUCKET }}/${{ github.ref == 'refs/heads/develop' && 'develop' || 'pull_request' }}
