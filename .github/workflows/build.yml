name: Build

on:
  workflow_call:
    inputs:
      target_platform:
        required: true
        type: string

jobs:
  build:
    name: Build ${{ inputs.target_platform }}
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.output_artifact_name.outputs.artifact_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install vendor
        run: ./install_vendor.sh ${{ secrets.vendor_url }}

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          buildName: 'Pop Pixie'
          targetPlatform: ${{ inputs.target_platform }}
          versioning: None

      - uses: actions/upload-artifact@v4
        with:
          name: Build-${{ inputs.target_platform }}
          path: build/${{ inputs.target_platform }}
